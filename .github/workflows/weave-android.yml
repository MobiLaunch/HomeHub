name: Weave Android

on:
  push:
    paths:
      - "weave-android/**"
      - ".github/workflows/weave-android.yml"
  pull_request:
    paths:
      - "weave-android/**"
      - ".github/workflows/weave-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weave-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: weave-debug-apk
          path: weave-android/app/build/outputs/apk/debug/*.apk
